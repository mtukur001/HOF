<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HOF | Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="admin.js"></script>
  <style>
    .admin-wrap{max-width:1100px;margin:0 auto;padding:38px 6% 70px}.admin-panel{border:1px solid var(--line);padding:24px;margin:22px 0;background:#fff}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.admin-field{display:flex;flex-direction:column;gap:7px;font-size:12px}.admin-field input,.admin-field select,.admin-field textarea{width:100%;padding:12px;border:1px solid #ddd;background:#fff;font:inherit;font-size:14px}.admin-field textarea{min-height:90px;resize:vertical}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.admin-secondary{border:1px solid #111;background:#fff;color:#111;padding:12px 18px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}.admin-products{display:grid;gap:12px}.admin-product{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.admin-product img{width:84px;height:84px;object-fit:cover;background:#f5f5f5}.admin-product h3{margin:0 0 5px;font-size:15px}.admin-product p{margin:0;color:var(--muted);font-size:12px}.admin-product-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-product-actions button{padding:9px 12px}.admin-note{font-size:12px;color:var(--muted)}#dashboard{display:none}.status{font-size:13px;margin-top:14px;min-height:20px}.checkrow{display:flex;gap:8px;align-items:center;font-size:13px}.checkrow input{width:auto}.hidden{display:none!important}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-product{grid-template-columns:64px 1fr}.admin-product img{width:64px;height:64px}.admin-product-actions{grid-column:2}.admin-panel{padding:17px}}
  </style>
</head>
<body>
  <header class="header"><a class="logo" href="index.html">HOF<small>HOME OF FABRIC</small></a><a href="index.html">VIEW WEBSITE ↗</a></header>
  <main class="admin-wrap">
    <section id="login-panel" class="admin-panel">
      <p class="eyebrow">HOME OF FABRIC</p><h1 style="font:500 38px 'Playfair Display',serif">Admin sign in</h1>
      <p class="admin-note">Authorised HOF administrator access only.</p>
      <form id="login-form" class="admin-grid">
        <label class="admin-field">Email<input id="email" type="email" required autocomplete="username"></label>
        <label class="admin-field">Password<input id="password" type="password" required autocomplete="current-password"></label>
        <div><button class="button" type="submit">Sign in</button></div>
      </form><p id="login-message" class="status" role="status"></p>
    </section>

    <section id="dashboard">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><p class="eyebrow">PRIVATE MANAGEMENT</p><h1 style="font:500 38px 'Playfair Display',serif;margin:8px 0">Product dashboard</h1></div><button id="logout" class="admin-secondary">Sign out</button></div>
      <section class="admin-panel">
        <h2 id="form-title" style="font:500 25px 'Playfair Display',serif">Add a product</h2>
        <form id="product-form">
          <input type="hidden" id="product-id">
          <div class="admin-grid">
            <label class="admin-field">Product name<input id="name" required maxlength="120" placeholder="e.g. Premium Swiss Voile"></label>
            <label class="admin-field">Price (₦)<input id="price" type="number" min="0" step="0.01" required placeholder="7500"></label>
            <label class="admin-field">Category<select id="category" required><option value="">Choose category</option><option>Fabrics</option><option>Lace</option><option>Voil</option><option>Atiku</option><option>Swiss</option><option>Getzner</option><option>Shadda</option><option>Wagambari</option><option>Caps</option><option>Accessories</option></select></label>
            <label class="admin-field">Price unit<select id="unit"><option value="yard">Per yard</option><option value="set">Per set</option><option value="piece">Per piece</option><option value="item">Per item</option></select></label>
            <label class="admin-field" style="grid-column:1/-1">Description<textarea id="description" placeholder="Brief product details (optional)"></textarea></label>
            <label class="admin-field" style="grid-column:1/-1">Product photos (select multiple)<input id="images" type="file" accept="image/*" multiple><span class="admin-note">New photos will be added to the product. Use clear, well-lit product images.</span></label>
          </div>
          <div class="admin-actions"><label class="checkrow"><input id="available" type="checkbox" checked> Available</label><label class="checkrow"><input id="new-arrival" type="checkbox"> New arrival</label></div>
          <div class="admin-actions"><button class="button" type="submit" id="save-button">Save product</button><button class="admin-secondary hidden" type="button" id="cancel-edit">Cancel edit</button></div>
        </form><p id="form-message" class="status" role="status"></p>
      </section>
      <section class="admin-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="font:500 25px 'Playfair Display',serif;margin:0">Your catalogue</h2><button id="refresh" class="admin-secondary">Refresh</button></div><p class="admin-note">Manage the products displayed on your public website.</p><div id="product-list" class="admin-products" aria-live="polite"></div><p id="list-message" class="status" role="status"></p></section>
    </section>
  </main>
</body></html>
